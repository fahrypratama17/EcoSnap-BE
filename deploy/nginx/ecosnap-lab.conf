# Internal UB demo only: HTTP exposes bearer tokens and images in transit.
# Replace with trusted HTTPS before public or sensitive use.
server {
    listen 80;
    server_name 10.34.211.188;

    client_max_body_size 10551296;
    client_body_timeout 20s;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    # Do not trust client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    # Never replay a scan or mutation on another upstream automatically.
    proxy_next_upstream off;
    proxy_request_buffering off;

    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /api/scan {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /ai/health {
        proxy_pass http://127.0.0.1:8000/health;
    }
    location = /docs {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /redoc {
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        return 404;
    }
}
