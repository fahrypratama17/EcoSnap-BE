openapi: 3.0.3
info:
  title: EcoSnap Backend API
  version: 1.0.0
  description: |
    Kontrak REST API backend EcoSnap (Go `net/http`, PostgreSQL, Firebase Auth). Dokumen ini diturunkan dari router,
    handler, service, dan entity yang berjalan; 46 operasi, tanpa endpoint fiktif.

    **Autentikasi.** Semua operasi kecuali `GET /health` memerlukan `Authorization: Bearer <Firebase ID token>`.
    Identitas (UID) hanya berasal dari token; UID di body/query ditolak sebagai field/parameter asing. Token hilang,
    salah skema, atau tidak valid menghasilkan 401 `unauthorized` dengan header `WWW-Authenticate: Bearer`.
    Operasi **fresh auth** (`claimDeposit`, `redeemReward`) memakai verifikasi dengan pengecekan pencabutan token dan
    akun Firebase yang dinonaktifkan (satu panggilan jaringan tambahan); token yang dicabut/dinonaktifkan mendapat 401.
    Kegagalan verifikasi karena deadline request (15 detik) mendapat 504 `request_timeout`, bukan 401.

    **Peran dan status.** Akun berperan `user` atau `mitra` dan berstatus `active` / `suspended` / `deleted`. Akun
    non-active ditolak 403 `account_forbidden`; Firebase sudah ada tetapi profil belum dibuat `POST /accounts`
    memberi 404 `account_not_found`. Mitra baru berstatus **pending** (`business.status`), belum punya lokasi, dan
    tidak dapat membuat setoran atau QR sampai lokasinya `verified` secara manual oleh pemilik repo; riwayat/home
    mitra tetap terbaca untuk lokasi non-verified (read-only).

    **Envelope.** Sukses: `{"data": ...}`; daftar menambah `pagination` (cursor: `limit`, `next_cursor` nullable;
    offset: `limit`, `offset`, `has_more`). Error: `{"error": {"code", "message"}}`. Percabangan logika memakai
    status HTTP + `code`. Daftar kosong selalu `[]`, bukan `null`. Setiap respons membawa `X-Request-ID` buatan server
    (ID dari klien diabaikan).

    **Konvensi.** JSON `snake_case`. Body request maksimal 16 KiB (tiket bantuan 64 KiB), tepat satu objek JSON,
    `Content-Type: application/json` (parameter charset boleh), field tidak dikenal -> 400. Query asing, berulang, atau
    malformed -> 400. Waktu RFC 3339 (`date-time`) dan boleh memakai offset UTC (mis. `+07:00` untuk jendela WIB);
    klien WAJIB menerima offset apa pun. Poin adalah integer; berat dan tarif adalah **string desimal** bertitik
    (bukan angka JSON). Request: skema `additionalProperties: false`. Response: field tambahan mungkin muncul di
    masa depan; klien harus mengabaikannya. QR setoran adalah token pembawa (bearer): siapa pun yang memegang QR aktif
    pertama dapat mengklaimnya. Tarif, reward, voucher, FAQ, dan artikel berlabel `is_demo`/`uses_demo_rates` adalah
    konten simulasi; voucher tidak dapat dicairkan nyata.
  license:
    name: Proprietary
servers:
  - url: http://127.0.0.1:8080
    description: "Backend lokal"
  - url: http://10.0.2.2:8080
    description: "Android Emulator menuju backend di laptop"
security:
  - bearerAuth: []
tags:
  - { name: Health, description: "Liveness tanpa autentikasi" }
  - { name: Auth, description: "Pemeriksaan token Firebase" }
  - { name: Accounts, description: "Registrasi dan profil akun" }
  - { name: Settings, description: "Pengaturan akun" }
  - { name: Partners, description: "Mitra dan kategori sampah" }
  - { name: Favorites, description: "Mitra favorit" }
  - { name: Estimates, description: "Estimasi poin" }
  - { name: Deposits, description: "Setoran mitra dan QR klaim" }
  - { name: Wallet, description: "Saldo, riwayat, dan beranda" }
  - { name: Rewards, description: "Reward dan voucher" }
  - { name: Articles, description: "Artikel edukasi" }
  - { name: Gamification, description: "Misi mingguan, badge, dan leaderboard" }
  - { name: Reports, description: "Laporan aktivitas JSON dan PDF" }
  - { name: Support, description: "FAQ dan tiket bantuan" }
  - { name: Notifications, description: "Inbox dalam aplikasi" }
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness server
      description: "Publik, tanpa Bearer token. Tidak memeriksa database."
      security: []
      responses:
        '200':
          description: "Server hidup."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthIdentity
      summary: Klaim identitas dari token Firebase
      description: "Hanya memeriksa token; tidak membuat atau membaca akun aplikasi. Tidak ada pemeriksaan query."
      responses:
        '200':
          description: "Identitas dari token."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/accounts:
    post:
      tags: [Accounts]
      operationId: registerAccount
      summary: Buat profil aplikasi setelah sign-up Firebase
      description: |
        Idempotent: panggilan ulang dengan isi sama mengembalikan profil yang ada (200). Role `user` tidak boleh
        mengirim `business_name`/`business_category` (kosong/dihilangkan); role `mitra` wajib keduanya dan mendapat
        `business.status = pending` tanpa lokasi. Email diambil dari token. Pendaftaran membuat dompet dan pengaturan awal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRegistrationRequest' }
      responses:
        '201':
          description: "Profil baru dibuat."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfileResponse' }
        '200':
          description: "Profil sudah ada dengan isi pendaftaran yang sama (replay)."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfileResponse' }
        '400':
          description: "`invalid_request` (JSON/field tidak valid, field asing, teks tambahan) atau `invalid_account` (nilai pendaftaran tidak valid)."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '409':
          description: "`account_conflict`: profil sudah ada dengan data pendaftaran berbeda."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/me:
    get:
      tags: [Accounts]
      operationId: getMyProfile
      summary: Profil akun, dompet ringkas, dan pengaturan
      description: "Tidak memeriksa query. Mitra pending memiliki `business.status = pending`."
      responses:
        '200':
          description: "Profil akun."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfileResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    patch:
      tags: [Accounts]
      operationId: updateMyProfile
      summary: Ubah nama lengkap dan/atau telepon
      description: "Tanpa query. Kirim minimal satu field; `null` tidak diperbolehkan. Nilai di-trim."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdateRequest' }
      responses:
        '200':
          description: "Profil terbaru."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfileResponse' }
        '400':
          description: "`invalid_request` (body/query tidak valid, field asing, null) atau `invalid_profile` (nilai tidak valid)."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/me/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Pengaturan akun
      description: "Tanpa query (apa pun, termasuk `?` kosong, ditolak 400 `invalid_request`)."
      responses:
        '200':
          description: "Pengaturan akun."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettingsResponse' }
        '400':
          description: "`invalid_request`: query tidak diterima."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Ubah pengaturan notifikasi/onboarding
      description: |
        Hanya `notification_enabled` dan/atau `onboarding_completed` (boolean, `false` sah, dihilangkan = tidak berubah,
        `null` ditolak). Visibilitas leaderboard diubah lewat `setLeaderboardVisibility`. `notification_enabled=false`
        menahan notifikasi baru; yang sudah ada tetap terbaca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountSettingsUpdateRequest' }
      responses:
        '200':
          description: "Pengaturan terbaru."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettingsResponse' }
        '400':
          description: "`invalid_request`: body/query tidak valid, field asing, null, atau tidak ada field."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/waste-categories:
    get:
      tags: [Partners]
      operationId: listWasteCategories
      summary: Kategori sampah
      description: "Tanpa parameter. Tidak memeriksa profil akun."
      responses:
        '200':
          description: "Daftar kategori."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WasteCategoryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/partners:
    get:
      tags: [Partners]
      operationId: listPartners
      summary: Daftar mitra terverifikasi (offset)
      description: |
        Hanya mitra `verified` dengan akun mitra `active`. Pencarian `q` (substring nama/area, case-insensitive) dan
        `material` (slug kategori; slug valid tetapi tidak dikenal menghasilkan daftar kosong). Belum ada radius/GPS.
        Parameter tidak dikenal atau berulang -> 400 `invalid_partner_query`. `limit=0` ditolak.
      parameters:
        - name: q
          in: query
          required: false
          description: "Substring nama/area, maksimal 100 karakter (setelah trim)."
          schema: { type: string, maxLength: 100 }
        - name: material
          in: query
          required: false
          description: "Slug kategori (huruf kecil/angka/hyphen, maks. 100; dinormalisasi lowercase)."
          schema: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Halaman mitra."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerPageResponse' }
        '400':
          description: "`invalid_partner_query`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/partners/{partnerID}:
    get:
      tags: [Partners]
      operationId: getPartner
      summary: Detail mitra terverifikasi
      description: "ID bukan UUID -> 400 `invalid_partner_query`. Mitra tidak ada atau tidak terlihat -> 404."
      parameters:
        - $ref: '#/components/parameters/PartnerID'
      responses:
        '200':
          description: "Detail mitra."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerDetailResponse' }
        '400':
          description: "`invalid_partner_query`: ID mitra bukan UUID."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "`partner_not_found`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/me/favorites:
    get:
      tags: [Favorites]
      operationId: listFavoritePartners
      summary: Daftar ID mitra favorit (offset)
      description: "Hanya `limit` (1-100, default 20) dan `offset` (0-10000, default 0); lainnya -> 400 `invalid_partner_query`."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: "Halaman favorit."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoritePageResponse' }
        '400':
          description: "`invalid_partner_query`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/me/favorites/{partnerID}:
    put:
      tags: [Favorites]
      operationId: addFavoritePartner
      summary: Tandai mitra favorit
      description: "Idempotent. Tanpa body dan tanpa query. Hanya mitra verified dan aktif yang dapat difavoritkan."
      parameters:
        - $ref: '#/components/parameters/PartnerID'
      responses:
        '204':
          description: "Favorit tersimpan (atau sudah ada). Tanpa body."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
        '400':
          description: "`invalid_partner_query`: ID bukan UUID atau ada query."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404':
          description: "`partner_not_found` (mitra tidak terlihat) atau `account_not_found`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    delete:
      tags: [Favorites]
      operationId: removeFavoritePartner
      summary: Hapus mitra dari favorit
      description: "Idempotent; tetap 204 bila belum favorit. Tanpa body dan tanpa query."
      parameters:
        - $ref: '#/components/parameters/PartnerID'
      responses:
        '204':
          description: "Favorit terhapus (atau memang tidak ada). Tanpa body."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
        '400':
          description: "`invalid_partner_query`: ID bukan UUID atau ada query."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/point-estimates:
    post:
      tags: [Estimates]
      operationId: estimatePoints
      summary: Hitung estimasi poin (bukan janji saldo)
      description: |
        Tanpa query. Maksimal 50 item, kategori tidak boleh ganda, tiap berat 0.001-1000.000 kg dan total maksimal
        1000 kg. Poin = jumlah hasil kali eksak per item, dibulatkan ke bawah sekali. `partner_id` opsional memeriksa
        material diterima mitra itu. Setoran nyata dihitung ulang server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PointEstimateRequest' }
      responses:
        '200':
          description: "Hasil estimasi."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointEstimateResponse' }
        '400':
          description: "`invalid_request` (body tidak valid), `invalid_estimate` (item/berat/ID tidak valid atau query ada), atau `waste_not_accepted` (mitra tidak menerima material)."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "`waste_category_not_found` atau `partner_not_found`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`point_rate_unavailable`: belum ada tarif aktif."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/deposits:
    post:
      tags: [Deposits]
      operationId: createDeposit
      summary: Mitra membuat setoran
      description: |
        Hanya mitra `active` dengan lokasi `verified`. Partner, tarif, dan total dihitung server dari mitra
        terautentikasi (jangan kirim). **Idempotency-Key wajib** (8-128 karakter `A-Za-z0-9_-`): kunci baru per
        percobaan, ulangi kunci yang sama saat retry -> 200 dengan setoran yang sama; kunci sama dengan isi berbeda ->
        409. Total poin 0 ditolak. Tanpa query.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositCreateRequest' }
      responses:
        '201':
          description: "Setoran baru dibuat."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositResponse' }
        '200':
          description: "Replay: kunci dan isi sama dengan setoran yang sudah ada."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositResponse' }
        '400':
          description: "`invalid_idempotency_key`, `invalid_request`, `invalid_estimate` (item/berat tidak valid atau query ada), `waste_not_accepted`, atau `zero_points`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: "`deposit_forbidden` (bukan mitra atau lokasi belum verified/suspended) atau `account_forbidden`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: "`waste_category_not_found` atau `account_not_found`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: "`idempotency_conflict` (kunci dipakai untuk isi berbeda) atau `point_rate_unavailable`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
