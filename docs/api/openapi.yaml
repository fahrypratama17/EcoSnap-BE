              schema: { $ref: '#/components/schemas/MissionClaimResultResponse' }
        '200':
          description: "Replay pada periode yang sama."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionClaimResultResponse' }
        '400':
          description: "`invalid_request` (body/period_start tidak valid) atau `invalid_query`."
