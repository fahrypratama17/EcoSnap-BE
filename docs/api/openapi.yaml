    post:
      tags: [Support]
      operationId: createSupportTicket
      summary: Kirim laporan masalah atau masukan
      description: |
        Semua akun aktif. **Idempotency-Key wajib**; retry dengan kunci dan isi sama -> 200 tiket yang sama; kunci
        sama dengan isi berbeda -> 409. Maksimal 20 tiket belum selesai (`open`/`in_progress`) per akun -> 429.
        Balasan manual terlihat lewat daftar/detail tiket; tidak ada email/notifikasi/lampiran/SLA. Tanpa query.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketRequest' }
      responses:
        '201':
          description: "Tiket dibuat."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketResponse' }
        '200':
          description: "Replay: kunci dan isi sama."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketResponse' }
        '400':
          description: "`invalid_ticket`, `invalid_idempotency_key`, `invalid_query`, atau `invalid_request` (body bukan tepat kind/subject/message)."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/AccountForbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409':
          description: "`idempotency_conflict`."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: "`ticket_limit_reached`: terlalu banyak tiket belum selesai."
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    get:
