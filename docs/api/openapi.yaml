components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: "Firebase ID token (JWT) di header `Authorization`. Skema `Bearer` tidak peka huruf besar-kecil."
  headers:
    RequestId:
      description: "ID request buatan server untuk korelasi laporan."
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Kunci per percobaan (mis. UUID), 8-128 karakter `A-Za-z0-9_-`. Ulangi kunci yang sama saat retry."
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    Limit:
      name: limit
      in: query
      required: false
      description: "Ukuran halaman."
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Nilai buram dari `pagination.next_cursor`; jangan diurai atau dipakai ulang dengan filter lain."
      schema: { type: string }
    From:
      name: from
      in: query
      required: false
      description: "Batas awal inklusif, RFC 3339 dengan zona (`Z` atau offset; encode `+` sebagai `%2B`)."
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      description: "Batas akhir eksklusif, RFC 3339 dengan zona."
      schema: { type: string, format: date-time }
    PartnerID:
      name: partnerID
      in: path
      required: true
      schema: { type: string, format: uuid }
    DepositID:
      name: depositID
      in: path
      required: true
      schema: { type: string, format: uuid }
    RewardID:
      name: rewardID
      in: path
      required: true
      schema: { type: string, format: uuid }
    VoucherID:
      name: voucherID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArticleID:
      name: articleID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketID:
      name: ticketID
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationID:
      name: notificationID
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: "`unauthorized`: Bearer token hilang, salah skema, tidak valid, kedaluwarsa, atau (fresh auth) dicabut/akun dinonaktifkan. Menyertakan `WWW-Authenticate: Bearer`."
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        WWW-Authenticate: { schema: { type: string, enum: [Bearer] } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: { code: unauthorized, message: ID token Firebase tidak valid atau sudah kedaluwarsa. } }
    AccountNotFound:
      description: "`account_not_found`: Firebase sudah ada tetapi profil belum dibuat (`registerAccount`)."
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccountForbidden:
      description: "`account_forbidden`: akun tidak aktif."
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BodyTooLarge:
      description: "`body_too_large`: body melebihi batas (16 KiB; tiket bantuan 64 KiB)."
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: "`unsupported_media_type`: gunakan `Content-Type: application/json`."
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: "`internal_error`: kesalahan server. Operasi tulis aman diulang dengan Idempotency-Key yang sama."
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTimeout:
      description: "`request_timeout`: batas waktu request/operasi terlampaui. Periksa hasil sebelum mengulang operasi tulis, atau ulangi dengan kunci yang sama."
      headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Kode stabil untuk percabangan logika (mis. `unauthorized`, `invalid_query`, `account_not_found`, `idempotency_conflict`). Klien harus menoleransi kode baru."
        message:
          type: string
          description: "Pesan berbahasa Indonesia yang boleh ditampilkan ke pengguna."
    Timestamp:
      type: string
      format: date-time
      description: "RFC 3339; boleh `Z` atau offset (mis. `+07:00`)."
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
      description: "RFC 3339 atau `null`."
    WeightKg:
      type: string
      pattern: '^[0-9]+\.[0-9]{3}$'
      description: "Berat kilogram desimal bertitik, tepat 3 desimal (mis. `\"2.500\"`)."
    CursorPagination:
      type: object
      required: [limit, next_cursor]
      properties:
        limit: { type: integer }
        next_cursor:
          type: string
          nullable: true
          description: '`null` berarti halaman terakhir.'
    OffsetPagination:
      type: object
      required: [limit, offset, has_more]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Identity:
      type: object
      required: [uid, email, email_verified]
      properties:
        uid: { type: string }
        email: { type: string, description: "Kosong bila token tanpa email." }
        email_verified: { type: boolean }
    IdentityResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Identity' }
    AccountRole:
      type: string
      enum: [user, mitra]
    AccountRegistrationRequest:
      type: object
      additionalProperties: false
      required: [role, full_name, phone]
      properties:
        role: { $ref: '#/components/schemas/AccountRole' }
        full_name: { type: string, minLength: 1, maxLength: 150, description: "Setelah trim." }
        phone: { type: string, pattern: '^\+?[0-9]{9,15}$', description: "9-15 digit dengan `+` opsional di depan." }
        business_name: { type: string, minLength: 0, maxLength: 150, description: "Wajib (1-150) untuk `mitra`; harus kosong/dihilangkan untuk `user`." }
        business_category: { type: string, minLength: 0, maxLength: 80, description: "Wajib (1-80) untuk `mitra`; harus kosong/dihilangkan untuk `user`." }
    AccountProfileUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, pattern: '^\+?[0-9]{9,15}$' }
    AccountSettingsUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        notification_enabled: { type: boolean }
        onboarding_completed: { type: boolean }
    WalletSummary:
      type: object
      required: [balance, total_earned, total_spent]
      properties:
        balance: { type: integer, format: int64 }
        total_earned: { type: integer, format: int64 }
        total_spent: { type: integer, format: int64 }
    AccountSettings:
      type: object
      required: [notification_enabled, show_on_leaderboard, onboarding_completed]
      properties:
        notification_enabled: { type: boolean }
        show_on_leaderboard: { type: boolean }
        onboarding_completed: { type: boolean }
    AccountSettingsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AccountSettings' }
    BusinessRegistration:
      type: object
      required: [name, category, status]
      properties:
        name: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
          description: "Status pendaftaran bisnis; `pending` menunggu persetujuan manual pemilik repo."
    AccountProfile:
      type: object
      required: [uid, role, full_name, display_name, email, phone, status, created_at, wallet, settings]
      properties:
        uid: { type: string, description: "UID Firebase." }
        role: { $ref: '#/components/schemas/AccountRole' }
        full_name: { type: string }
        display_name: { type: string }
        email: { type: string }
        phone: { type: string }
        status: { type: string, enum: [active, suspended, deleted] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        wallet: { $ref: '#/components/schemas/WalletSummary' }
        settings: { $ref: '#/components/schemas/AccountSettings' }
        business:
          $ref: '#/components/schemas/BusinessRegistration'
    AccountProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AccountProfile' }
    WasteCategory:
      type: object
      required: [id, name, slug, code, handling_guide, requires_special_handling]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        code: { type: string, description: 'Mis. `PLASTIC`, `PAPER`, `METAL`, `GLASS`; kategori baru mungkin muncul.' }
        handling_guide: { type: string }
        requires_special_handling: { type: boolean }
    WasteCategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WasteCategory' }
    PartnerLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    PartnerHour:
      type: object
      required: [day_of_week, opens_at, closes_at, is_closed]
      properties:
        day_of_week: { type: integer, minimum: 0, maximum: 6, description: "0=Minggu ... 6=Sabtu." }
        opens_at: { type: string, description: '`HH:MM`, string kosong bila tutup.' }
        closes_at: { type: string, description: '`HH:MM`, string kosong bila tutup.' }
        is_closed: { type: boolean }
    PartnerDetail:
      type: object
      required: [id, name, area, address, phone, opening_hours, description, location, accepted_materials, hours]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        area: { type: string }
        address: { type: string }
        phone: { type: string }
        opening_hours: { type: string, description: "Ringkasan teks jam buka." }
        description: { type: string }
        location: { $ref: '#/components/schemas/PartnerLocation' }
        accepted_materials:
          type: array
          items: { $ref: '#/components/schemas/WasteCategory' }
        hours:
          type: array
          items: { $ref: '#/components/schemas/PartnerHour' }
    PartnerDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PartnerDetail' }
    PartnerPageResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PartnerDetail' }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }
    FavoritePartner:
      type: object
      required: [partner_id, created_at]
      properties:
        partner_id: { type: string, format: uuid }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    FavoritePageResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FavoritePartner' }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }
    PointEstimateInput:
      type: object
      additionalProperties: false
      required: [category_id, weight_kg]
      properties:
        category_id: { type: string, format: uuid }
        weight_kg:
          type: string
          pattern: '^[0-9]{1,4}(\.[0-9]{1,3})?$'
          description: "String desimal bertitik, maksimal 3 desimal, nilai 0.001-1000.000 (jangan angka JSON, koma, atau notasi ilmiah)."
    PointEstimateRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        partner_id:
          type: string
          format: uuid
          nullable: true
          description: "Opsional; bila diisi, material harus diterima mitra tersebut."
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: "Kategori tidak boleh ganda; total berat maksimal 1000 kg."
          items: { $ref: '#/components/schemas/PointEstimateInput' }
    PointEstimateItem:
      type: object
      required: [category_id, category_name, weight_kg, rate_id, points_per_kg, exact_points, is_demo]
      properties:
        category_id: { type: string, format: uuid }
        category_name: { type: string }
        weight_kg: { $ref: '#/components/schemas/WeightKg' }
        rate_id: { type: string, format: uuid }
        points_per_kg: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', description: "Tarif poin per kg, 2 desimal." }
        exact_points: { type: string, pattern: '^[0-9]+\.[0-9]{5}$', description: "Hasil kali eksak sebelum pembulatan, 5 desimal." }
        is_demo: { type: boolean, description: "Tarif contoh (demo)." }
    PointEstimate:
      type: object
      required: [as_of, total_weight_kg, estimated_points, uses_demo_rates, items]
      properties:
        partner_id:
          type: string
          format: uuid
          description: "Hanya ada bila request menyertakan `partner_id`."
        as_of: { $ref: '#/components/schemas/Timestamp' }
        total_weight_kg: { $ref: '#/components/schemas/WeightKg' }
        estimated_points: { type: integer, format: int64 }
        uses_demo_rates: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/PointEstimateItem' }
    PointEstimateResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PointEstimate' }
    DepositCreateRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: "Hanya material terukur; mitra, tarif, dan total dihitung server."
          items: { $ref: '#/components/schemas/PointEstimateInput' }
    DepositStatus:
      type: string
      enum: [created, qr_issued, claimed]
    Deposit:
      type: object
      required: [id, partner_id, status, total_weight_kg, total_points, uses_demo_rates, rates_as_of, created_at, items]
      properties:
        id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DepositStatus' }
        total_weight_kg: { $ref: '#/components/schemas/WeightKg' }
        total_points: { type: integer, format: int64 }
        uses_demo_rates: { type: boolean }
        rates_as_of: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PointEstimateItem' }
    DepositResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Deposit' }
    DepositQr:
      type: object
      required: [deposit_id, token, issued_at, expires_at, server_time, warning]
      properties:
        deposit_id: { type: string, format: uuid }
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: "Token bearer 43 karakter base64url; hanya dikembalikan sekali, encode apa adanya sebagai QR." }
        issued_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        warning: { type: string, description: "Teks peringatan bearer yang wajib ditampilkan di layar QR." }
    DepositQrResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DepositQr' }
    ClaimTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    DepositClaimPreview:
      type: object
      required: [deposit_id, partner_id, partner_name, total_weight_kg, total_points, uses_demo_rates, expires_at, server_time, items]
      properties:
        deposit_id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid }
        partner_name: { type: string }
        total_weight_kg: { $ref: '#/components/schemas/WeightKg' }
        total_points: { type: integer, format: int64 }
        uses_demo_rates: { type: boolean }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PointEstimateItem' }
    DepositClaimPreviewResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DepositClaimPreview' }
    DepositClaim:
      type: object
      required: [deposit_id, partner_id, points, claimed_at, wallet_balance]
      properties:
        deposit_id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid }
        points: { type: integer, format: int64 }
        claimed_at: { $ref: '#/components/schemas/Timestamp' }
        wallet_balance: { type: integer, format: int64 }
    DepositClaimResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DepositClaim' }
    Wallet:
      type: object
      required: [balance, total_earned, total_spent, updated_at]
      properties:
        balance: { type: integer, format: int64 }
        total_earned: { type: integer, format: int64 }
        total_spent: { type: integer, format: int64 }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    WalletResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Wallet' }
    PointHistoryDeposit:
      type: object
      required: [id, partner_id, partner_name, total_weight_kg]
      properties:
        id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid }
        partner_name: { type: string }
        total_weight_kg: { $ref: '#/components/schemas/WeightKg' }
    PointHistoryRedemption:
      type: object
      required: [id, reward_name]
      properties:
        id: { type: string, format: uuid }
        reward_name: { type: string }
    PointHistoryEntry:
      type: object
      required: [id, amount, source, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: "Bertanda; kredit positif, penukaran negatif." }
        source: { type: string, enum: [deposit, redemption] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deposit:
          $ref: '#/components/schemas/PointHistoryDeposit'
        redemption:
          $ref: '#/components/schemas/PointHistoryRedemption'
    PointHistoryPageResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PointHistoryEntry' }
        pagination: { $ref: '#/components/schemas/CursorPagination' }
    PartnerDepositSummary:
      type: object
      required: [id, status, total_weight_kg, total_points, uses_demo_rates, created_at, claimed_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DepositStatus' }
        total_weight_kg: { $ref: '#/components/schemas/WeightKg' }
        total_points: { type: integer, format: int64 }
        uses_demo_rates: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        claimed_at: { $ref: '#/components/schemas/NullableTimestamp' }
    PartnerDepositPageResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PartnerDepositSummary' }
        pagination: { $ref: '#/components/schemas/CursorPagination' }
    HomeMonth:
      type: object
      required: [from, to, timezone]
      properties:
        from: { $ref: '#/components/schemas/Timestamp' }
        to: { $ref: '#/components/schemas/Timestamp' }
        timezone: { type: string, description: "Selalu `Asia/Jakarta`." }
    UserHome:
      type: object
      required: [user_name, server_time, month, wallet, deposits_claimed, monthly_deposits, total_weight_kg, active_vouchers, recent_activity, missions, partner, article, unread_count]
      properties:
        user_name: { type: string }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        month: { $ref: '#/components/schemas/HomeMonth' }
        wallet: { $ref: '#/components/schemas/Wallet' }
        deposits_claimed: { type: integer, format: int64, description: "All-time." }
        monthly_deposits: { type: integer, format: int64, description: "Klaim dalam `month`." }
        total_weight_kg: { $ref: '#/components/schemas/WeightKg' }
        active_vouchers: { type: integer, format: int64 }
        recent_activity:
          type: array
          description: "Maksimal 3 entri ledger terbaru."
          items: { $ref: '#/components/schemas/PointHistoryEntry' }
        missions:
          type: object
          nullable: true
          description: '`null` untuk mitra.'
          required: [period_start, period_end, server_time, weekly_xp, total_xp, missions]
          properties:
            period_start: { $ref: '#/components/schemas/Timestamp' }
            period_end: { $ref: '#/components/schemas/Timestamp' }
            server_time: { $ref: '#/components/schemas/Timestamp' }
            weekly_xp: { type: integer, format: int64 }
            total_xp: { type: integer, format: int64 }
            missions:
              type: array
              items: { $ref: '#/components/schemas/Mission' }
        partner:
          type: object
          nullable: true
          description: "Satu mitra saran global (bukan terdekat); `null` bila tidak ada."
          required: [id, name, area, address, phone, opening_hours, description, location, accepted_materials, hours]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            area: { type: string }
            address: { type: string }
            phone: { type: string }
            opening_hours: { type: string }
            description: { type: string }
            location: { $ref: '#/components/schemas/PartnerLocation' }
            accepted_materials:
              type: array
              items: { $ref: '#/components/schemas/WasteCategory' }
            hours:
              type: array
              items: { $ref: '#/components/schemas/PartnerHour' }
        article:
          type: object
          nullable: true
          description: "Satu artikel terbaru; `null` bila tidak ada."
          required: [id, title, summary, category, reading_minutes, is_featured, is_demo, published_at]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            summary: { type: string }
            category: { $ref: '#/components/schemas/ArticleCategory' }
            reading_minutes: { type: integer }
            is_featured: { type: boolean }
            is_demo: { type: boolean }
            published_at: { $ref: '#/components/schemas/Timestamp' }
        unread_count: { type: integer, format: int64 }
    UserHomeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/UserHome' }
    PartnerStatus:
      type: string
      enum: [pending, verified, rejected, suspended]
    PartnerDepositCounts:
      type: object
      required: [created, qr_issued, claimed]
