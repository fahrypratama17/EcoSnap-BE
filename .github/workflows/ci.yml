name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-api-contracts.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install contract validators
        run: python -m pip install -r scripts/requirements-api-contracts.txt
      - name: Validate OpenAPI and Postman route coverage
        run: python scripts/check-api-contracts.py
      - name: Validate Postman JavaScript
        run: node scripts/check-postman-scripts.cjs
      - name: Exercise contract gate failures
        run: python scripts/test-api-contracts.py
      - name: Exercise Postman script gate failures
        run: node --test scripts/test-postman-scripts.cjs

  smoke-offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse smoke scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($path in @("scripts/smoke-test.ps1", "scripts/smoke-flow-checks.ps1", "scripts/test-smoke-flows.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | Format-List; exit 1 }
            Write-Output ("PARSE_PASS " + $path)
          }
      - name: Exercise offline flow validators
        shell: powershell
        run: ./scripts/test-smoke-flows.ps1

  newman-full-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECOSNAP_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/newman/package-lock.json
      - name: Install pinned Newman tooling
        run: npm ci --prefix scripts/newman --ignore-scripts
      - name: Prove Newman detects failed and skipped checks
        run: node --test scripts/newman/test-runner.cjs
      - name: Exercise full HTTP flow on disposable PostgreSQL
        run: |
          go test -p 1 -mod=readonly -tags newman -count=1 -v ./internal/repository/postgres -run '^TestNewmanFullFlow$' 2>&1 | tee newman.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -- '--- SKIP' newman.log; then grep -- '--- SKIP' newman.log; exit 1; fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Disposable cluster: the integration tests create and drop their own
      # databases and the anon/authenticated roles Supabase normally provides.
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECOSNAP_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet -mod=readonly ./...
      - name: test (fails on skipped integration tests)
        # -p 1: integration tests share one cluster and build CLIs.
        run: |
          go test -p 1 -mod=readonly -count=1 -v ./... 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -- '--- SKIP' test.log; then grep -- '--- SKIP' test.log; exit 1; fi
